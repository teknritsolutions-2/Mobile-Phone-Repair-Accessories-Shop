name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify static entrypoints
        run: |
          test -s index.html
          for page in home2 services accessories pricing contact; do
            test -s "pages/$page.html"
          done
          test -s assets/css/style.css
          test -s assets/js/main.js
          test -s 404.html

      - name: Check static references and request behavior
        run: |
          python3 documentation/check-static.py
          node documentation/check-behavior.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Collect public files
        run: |
          mkdir -p "$RUNNER_TEMP/port-pixel-pages"
          cp index.html 404.html .nojekyll "$RUNNER_TEMP/port-pixel-pages/"
          cp -R assets pages "$RUNNER_TEMP/port-pixel-pages/"

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/port-pixel-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
